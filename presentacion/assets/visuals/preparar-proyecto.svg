<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="430" viewBox="0 0 1120 430" role="img"><title>Antes del primer modelo</title><desc>Leer el encargo, acordar decisiones, proponer organización y crear instrucciones. La aprobación humana precede a la escritura y al análisis.</desc>
<circle cx="50" cy="80" r="26" fill="#087F8C" stroke="none" stroke-width="2"/>
<text x="50" y="89" font-family="Fira Sans, Arial, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">
<tspan x="50" dy="0">1</tspan>
</text>
<text x="18" y="149" font-family="Fira Sans, Arial, sans-serif" font-size="32" font-weight="600" fill="#15333D" text-anchor="start">
<tspan x="18" dy="0">Entender</tspan>
</text>
<text x="18" y="203" font-family="Fira Sans, Arial, sans-serif" font-size="24" font-weight="400" fill="#52666E" text-anchor="start">
<tspan x="18" dy="0">PDF, diccionario</tspan>
</text>
<text x="18" y="238" font-family="Fira Sans, Arial, sans-serif" font-size="24" font-weight="400" fill="#52666E" text-anchor="start">
<tspan x="18" dy="0">y archivos</tspan>
</text>
<line x1="222" y1="143" x2="279" y2="143" stroke="#C6D5D7" stroke-width="2"/>
<polygon points="279.0,143.0 270.2,147.8 270.2,138.2" fill="#C6D5D7"/>
<circle cx="330" cy="80" r="26" fill="#BF2568" stroke="none" stroke-width="2"/>
<text x="330" y="89" font-family="Fira Sans, Arial, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">
<tspan x="330" dy="0">2</tspan>
</text>
<text x="298" y="149" font-family="Fira Sans, Arial, sans-serif" font-size="32" font-weight="600" fill="#15333D" text-anchor="start">
<tspan x="298" dy="0">Acordar</tspan>
</text>
<text x="298" y="203" font-family="Fira Sans, Arial, sans-serif" font-size="24" font-weight="400" fill="#52666E" text-anchor="start">
<tspan x="298" dy="0">Objetivos, límites</tspan>
</text>
<text x="298" y="238" font-family="Fira Sans, Arial, sans-serif" font-size="24" font-weight="400" fill="#52666E" text-anchor="start">
<tspan x="298" dy="0">y revisiones</tspan>
</text>
<line x1="502" y1="143" x2="559" y2="143" stroke="#C6D5D7" stroke-width="2"/>
<polygon points="559.0,143.0 550.2,147.8 550.2,138.2" fill="#C6D5D7"/>
<circle cx="610" cy="80" r="26" fill="#087F8C" stroke="none" stroke-width="2"/>
<text x="610" y="89" font-family="Fira Sans, Arial, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">
<tspan x="610" dy="0">3</tspan>
</text>
<text x="578" y="149" font-family="Fira Sans, Arial, sans-serif" font-size="32" font-weight="600" fill="#15333D" text-anchor="start">
<tspan x="578" dy="0">Organizar</tspan>
</text>
<text x="578" y="203" font-family="Fira Sans, Arial, sans-serif" font-size="24" font-weight="400" fill="#52666E" text-anchor="start">
<tspan x="578" dy="0">Originales intactos;</tspan>
</text>
<text x="578" y="238" font-family="Fira Sans, Arial, sans-serif" font-size="24" font-weight="400" fill="#52666E" text-anchor="start">
<tspan x="578" dy="0">derivados claros</tspan>
</text>
<line x1="782" y1="143" x2="839" y2="143" stroke="#C6D5D7" stroke-width="2"/>
<polygon points="839.0,143.0 830.2,147.8 830.2,138.2" fill="#C6D5D7"/>
<circle cx="890" cy="80" r="26" fill="#BF2568" stroke="none" stroke-width="2"/>
<text x="890" y="89" font-family="Fira Sans, Arial, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">
<tspan x="890" dy="0">4</tspan>
</text>
<text x="858" y="149" font-family="Fira Sans, Arial, sans-serif" font-size="32" font-weight="600" fill="#15333D" text-anchor="start">
<tspan x="858" dy="0">Configurar</tspan>
</text>
<text x="858" y="203" font-family="Fira Sans, Arial, sans-serif" font-size="24" font-weight="400" fill="#52666E" text-anchor="start">
<tspan x="858" dy="0">AGENTS.md + skill</tspan>
</text>
<text x="858" y="238" font-family="Fira Sans, Arial, sans-serif" font-size="24" font-weight="400" fill="#52666E" text-anchor="start">
<tspan x="858" dy="0">disponible</tspan>
</text>
<rect x="18" y="302" width="1080" height="91" rx="10" fill="#15333D" stroke="none" stroke-width="2"/>
<text x="558" y="340" font-family="Fira Sans, Arial, sans-serif" font-size="29" font-weight="600" fill="#FFFFFF" text-anchor="middle">
<tspan x="558" dy="0">Propuesta → revisión humana → cambios autorizados</tspan>
</text>
<text x="558" y="373" font-family="Fira Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#D4E6E8" text-anchor="middle">
<tspan x="558" dy="0">No empezamos copiando una plantilla ni ejecutando modelos.</tspan>
</text>
</svg>