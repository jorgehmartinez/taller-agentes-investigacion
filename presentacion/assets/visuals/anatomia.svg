<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="430" viewBox="0 0 1120 430" role="img"><title>Componentes de un agente</title><desc>Modelo en el centro, herramientas conectadas y un perímetro de contexto y permisos.</desc>
