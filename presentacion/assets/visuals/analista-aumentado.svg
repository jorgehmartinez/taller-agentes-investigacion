<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="430" viewBox="0 0 1120 430" role="img"><title>Asistencia al investigador</title><desc>El agente puede asumir mecánica sin asumir la responsabilidad científica.</desc>
