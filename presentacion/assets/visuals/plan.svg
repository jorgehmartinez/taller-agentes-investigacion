<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="430" viewBox="0 0 1120 430" role="img"><title>Planificación proporcional</title><desc>Dos tareas de distinto riesgo: una inspección breve no exige un archivo de plan; decisiones encadenadas requieren mayor explicitud.</desc>
<rect x="23" y="95" width="325" height="170" rx="14" fill="#15333D" stroke="none" stroke-width="2"/>
<text x="185" y="145" font-family="Fira Sans, Arial, sans-serif" font-size="25" font-weight="500" fill="#FFFFFF" text-anchor="middle">
<tspan x="185" dy="0">¿Cuánto puede cambiar</tspan>
</text>
<text x="185" y="182" font-family="Fira Sans, Arial, sans-serif" font-size="30" font-weight="600" fill="#FFFFFF" text-anchor="middle">
<tspan x="185" dy="0">esta tarea?</tspan>
</text>
<text x="185" y="227" font-family="Fira Sans, Arial, sans-serif" font-size="22" font-weight="400" fill="#BAD7DB" text-anchor="middle">
<tspan x="185" dy="0">riesgo + complejidad</tspan>
</text>
<line x1="360" y1="160" x2="560" y2="80" stroke="#087F8C" stroke-width="3"/>
<polygon points="560.0,80.0 553.6,87.7 550.1,78.8" fill="#087F8C"/>
<line x1="360" y1="205" x2="560" y2="303" stroke="#BF2568" stroke-width="3"/>
<polygon points="560.0,303.0 550.0,303.4 554.2,294.8" fill="#BF2568"/>
<rect x="580" y="14" width="510" height="145" rx="12" fill="#E9F4F3" stroke="none" stroke-width="2"/>
<text x="610" y="58" font-family="Fira Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#087F8C" text-anchor="start">
<tspan x="610" dy="0">Inspección acotada</tspan>
</text>
<text x="610" y="102" font-family="Fira Sans, Arial, sans-serif" font-size="25" font-weight="400" fill="#15333D" text-anchor="start">
<tspan x="610" dy="0">Objetivo + criterios claros.</tspan>
</text>
<text x="610" y="137" font-family="Fira Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#52666E" text-anchor="start">
<tspan x="610" dy="0">Sin un plan.md obligatorio.</tspan>
</text>
<rect x="580" y="239" width="510" height="155" rx="12" fill="#F9EAF0" stroke="none" stroke-width="2"/>
<text x="610" y="281" font-family="Fira Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#BF2568" text-anchor="start">
<tspan x="610" dy="0">Decisiones encadenadas</tspan>
</text>
<text x="610" y="324" font-family="Fira Sans, Arial, sans-serif" font-size="25" font-weight="400" fill="#15333D" text-anchor="start">
<tspan x="610" dy="0">Pasos, dependencias y revisiones.</tspan>
</text>
<text x="610" y="365" font-family="Fira Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#52666E" text-anchor="start">
<tspan x="610" dy="0">Un plan escrito puede ser útil.</tspan>
</text>
</svg>