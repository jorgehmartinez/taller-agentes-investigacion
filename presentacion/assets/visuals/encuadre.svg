</text>
<text x="615" y="307" font-family="Fira Sans, Arial, sans-serif" font-size="29" font-weight="600" fill="#BF2568" text-anchor="start">
<tspan x="615" dy="0">×</tspan>
</text>
<text x="655" y="307" font-family="Fira Sans, Arial, sans-serif" font-size="27" font-weight="400" fill="#15333D" text-anchor="start">
