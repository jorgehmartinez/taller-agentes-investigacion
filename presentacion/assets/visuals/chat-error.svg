<rect x="29" y="82" width="449" height="72" rx="10" fill="#F9EAF0" stroke="none" stroke-width="2"/>
<text x="46" y="110" font-family="Fira Sans, Arial, sans-serif" font-size="24" font-weight="400" fill="#15333D" text-anchor="start">
<tspan x="46" dy="0">«Quiero evaluar dos factores</tspan>
</text>
<text x="46" y="140" font-family="Fira Sans, Arial, sans-serif" font-size="24" font-weight="400" fill="#15333D" text-anchor="start">
<tspan x="46" dy="0">en 12 ítems ordinales.»</tspan>
</text>
<rect x="30" y="183" width="447" height="112" rx="9" fill="#F9EAF0" stroke="#BF2568" stroke-width="1.5"/>
<text x="50" y="217" font-family="Fira Sans, Arial, sans-serif" font-size="26" font-weight="500" fill="#BF2568" text-anchor="start">
<tspan x="50" dy="0">«No encuentra cfa().</tspan>
</text>
<text x="50" y="255" font-family="Fira Sans, Arial, sans-serif" font-size="26" font-weight="500" fill="#BF2568" text-anchor="start">
<tspan x="50" dy="0">¿Qué tengo que cambiar?»</tspan>
</text>
<text x="31" y="338" font-family="Fira Sans, Arial, sans-serif" font-size="24" font-weight="400" fill="#52666E" text-anchor="start">
<tspan x="31" dy="0">¿Paquete, ruta o estado de R?</tspan>
</text>
<line x1="651" y1="244" x2="1091" y2="244" stroke="#C6D5D7" stroke-width="2"/>
<text x="655" y="104" font-family="Fira Sans, Arial, sans-serif" font-size="19" font-weight="600" fill="#087F8C" text-anchor="start">
<tspan x="655" dy="0">SCRIPT</tspan>
</text>
<text x="655" y="275" font-family="Fira Sans, Arial, sans-serif" font-size="19" font-weight="600" fill="#087F8C" text-anchor="start">
<tspan x="655" dy="0">CONSOLA</tspan>
</text>
<text x="655" y="152" font-family="monospace" font-size="22" font-weight="400" fill="#15333D" text-anchor="start">
<tspan x="655" dy="0">ajuste &lt;- cfa(modelo,</tspan>
</text>
<text x="655" y="182" font-family="monospace" font-size="22" font-weight="400" fill="#15333D" text-anchor="start">
<tspan x="655" dy="0">  data = datos,</tspan>
</text>
<text x="655" y="212" font-family="monospace" font-size="22" font-weight="400" fill="#15333D" text-anchor="start">
<tspan x="655" dy="0">  ordered = items)</tspan>
</text>
<text x="655" y="317" font-family="monospace" font-size="23" font-weight="400" fill="#BF2568" text-anchor="start">
<tspan x="655" dy="0">Error: no se pudo encontrar</tspan>
</text>
<text x="655" y="353" font-family="monospace" font-size="23" font-weight="400" fill="#BF2568" text-anchor="start">
<tspan x="655" dy="0">la función &quot;cfa&quot;</tspan>
</text>
