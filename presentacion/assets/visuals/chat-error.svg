<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="430" viewBox="0 0 1120 430" role="img"><title>Del chat al entorno</title><desc>Recreación esquemática ficticia de ChatGPT web y RStudio. No reproduce una conversación real.</desc>
