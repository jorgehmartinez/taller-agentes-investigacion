<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="430" viewBox="0 0 1120 430" role="img"><title>Generación condicionada por el contexto</title><desc>Esquema de continuaciones posibles del modelo. No representa probabilidades medidas.</desc>
<rect x="15" y="120" width="330" height="155" rx="14" fill="#15333D" stroke="none" stroke-width="2"/>
<text x="42" y="160" font-family="Fira Sans, Arial, sans-serif" font-size="20" font-weight="600" fill="#87CDD0" text-anchor="start">
<tspan x="42" dy="0">CONTEXTO</tspan>
</text>
<text x="42" y="204" font-family="Fira Sans, Arial, sans-serif" font-size="28" font-weight="500" fill="#FFFFFF" text-anchor="start">
<tspan x="42" dy="0">«Describe estos</tspan>
<tspan x="42" dy="36.4">ítems»</tspan>
</text>
<line x1="355" y1="198" x2="560" y2="63" stroke="#087F8C" stroke-width="3"/>
<polygon points="560.0,63.0 555.3,71.8 550.0,63.8" fill="#087F8C"/>
<rect x="575" y="12" width="520" height="105" rx="10" fill="#E9F4F3" stroke="none" stroke-width="2"/>
<text x="600" y="52" font-family="monospace" font-size="26" font-weight="500" fill="#15333D" text-anchor="start">
<tspan x="600" dy="0">table(respuestas)</tspan>
</text>
<text x="600" y="90" font-family="Fira Sans, Arial, sans-serif" font-size="22" font-weight="400" fill="#52666E" text-anchor="start">
<tspan x="600" dy="0">Contar categorías</tspan>
</text>
<line x1="355" y1="198" x2="560" y2="193" stroke="#087F8C" stroke-width="3"/>
<polygon points="560.0,193.0 551.3,198.0 551.1,188.4" fill="#087F8C"/>
<rect x="575" y="142" width="520" height="105" rx="10" fill="#E9F4F3" stroke="none" stroke-width="2"/>
<text x="600" y="182" font-family="monospace" font-size="26" font-weight="500" fill="#15333D" text-anchor="start">
<tspan x="600" dy="0">summary(respuestas)</tspan>
</text>
<text x="600" y="220" font-family="Fira Sans, Arial, sans-serif" font-size="22" font-weight="400" fill="#52666E" text-anchor="start">
<tspan x="600" dy="0">Resumir valores</tspan>
</text>
<line x1="355" y1="198" x2="560" y2="323" stroke="#BF2568" stroke-width="3"/>
<polygon points="560.0,323.0 550.0,322.5 555.0,314.3" fill="#BF2568"/>
<rect x="575" y="272" width="520" height="105" rx="10" fill="#F9EAF0" stroke="none" stroke-width="2"/>
<text x="600" y="312" font-family="monospace" font-size="26" font-weight="500" fill="#15333D" text-anchor="start">
<tspan x="600" dy="0">mean(respuestas)</tspan>
</text>
<text x="600" y="350" font-family="Fira Sans, Arial, sans-serif" font-size="22" font-weight="400" fill="#52666E" text-anchor="start">
<tspan x="600" dy="0">Calcular una media</tspan>
</text>
<text x="20" y="386" font-family="Fira Sans, Arial, sans-serif" font-size="22" font-weight="400" fill="#52666E" text-anchor="start">
<tspan x="20" dy="0">Opciones ilustrativas; la configuración y la decodificación afectan la variabilidad.</tspan>
</text>
</svg>