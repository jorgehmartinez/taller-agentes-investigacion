<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="430" viewBox="0 0 1120 430" role="img"><title>Inspeccionar antes de adoptar</title><desc>Cadena de revisión desde la procedencia de una skill hasta una prueba reproducible.</desc>
